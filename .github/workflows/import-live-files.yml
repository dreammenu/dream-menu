name: Import public files from the live site
on:
  push:
    paths: ['tools/import-list.txt', '.github/workflows/import-live-files.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          set -e
          bad=0
          while read -r f sha; do
            [ -z "$f" ] && continue
            mkdir -p "$(dirname "$f")"
            url="https://www.dream-menu.com/$f"
            case "$f" in *.html) url="https://www.dream-menu.com/${f%.html}";; esac
            [ "$f" = "index.html" ] && url="https://www.dream-menu.com/"
            curl -fsSL --retry 3 -H 'Accept-Encoding: identity' -o "$f" "$url" || curl -fsSL --retry 3 -o "$f" "https://www.dream-menu.com/$f"
            got=$(sha1sum "$f" | cut -c1-40)
            if [ "$got" != "$sha" ]; then echo "MISMATCH $f $got (want $sha)"; bad=1; else echo "ok $f"; fi
          done < tools/import-list.txt
          exit $bad
      - name: Commit
        run: |
          git config user.name "dream-menu-bot"
          git config user.email "actions@github.com"
          git rm -q --cached tools/import-list.txt .github/workflows/import-live-files.yml
          rm tools/import-list.txt .github/workflows/import-live-files.yml
          git add -A
          git commit -m "Import public site files from the live deployment (verified against Vercel hashes)"
          git push
