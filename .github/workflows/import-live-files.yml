name: Import public files from the live site
on:
  push:
    paths: ['tools/import-list.txt', '.github/workflows/import-live-files.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and commit
        run: |
          B=https://www.dream-menu.com
          : > tools/import-report.txt
          left=""
          while read -r f sha; do
            [ -z "$f" ] && continue
            mkdir -p "$(dirname "$f")"
            ok=0
            base="${f%.html}"
            for u in "$B/$f" "$B/$base" "$B/"; do
              [ "$u" = "$B/" ] && [ "$f" != "index.html" ] && continue
              curl -sSL --retry 2 -o /tmp/dl "$u" || continue
              if [ "$(sha1sum /tmp/dl | cut -c1-40)" = "$sha" ]; then mv /tmp/dl "$f"; ok=1; break; fi
            done
            if [ $ok = 1 ]; then echo "ok $f" >> tools/import-report.txt; else echo "MISSING $f $sha" >> tools/import-report.txt; left="$left$f $sha\n"; rm -f "$f"; fi
          done < tools/import-list.txt
          cat tools/import-report.txt
          printf "$left" > tools/import-list.txt
          git config user.name "dream-menu-bot"
          git config user.email "actions@github.com"
          if [ ! -s tools/import-list.txt ]; then git rm -q tools/import-list.txt .github/workflows/import-live-files.yml; fi
          git add -A
          git commit -m "Import public site files from the live deployment (each checked against its Vercel hash)" || true
          git push
